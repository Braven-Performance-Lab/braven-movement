# The Braven Studio Worker: the Studio page, and the review loop under /api/.
#
# The owner approved a preview on 13 November 2026 (board card Studio/studio-deploy-go): the
# Worker on its workers.dev address, on the Cloudflare account that holds Braven Tactics. The
# D1 database exists (created 13 November 2026, western Europe, migration 0001 applied). A
# custom domain and its DNS record need a second yes from the owner.
#
# No secret belongs in this file, and the Worker needs none: FIREBASE_PROJECT_ID is a public
# identifier, the same one Braven Tactics ships.
name = "braven-studio"
main = "src/worker.mjs"
compatibility_date = "2026-08-21"

[vars]
# The same Firebase project as Braven Tactics, so a uid is one person in the two products (ACC-4).
FIREBASE_PROJECT_ID = "braven-training-dev"

# The Studio page. Requests under /api/ go to the Worker; all other paths are static files.
# Do not point this at a build that holds `athlete-assets/`: the athlete is served through
# /api/versions/ behind the token, never as a static file.
[assets]
directory = "../viewer/dist-hosted"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "braven-studio"
database_id = "b49c248e-4c86-4eaa-82b0-95621a9300f5"
migrations_dir = "migrations"

# Private: no public address and no custom domain. Files leave through the Worker only.
[[r2_buckets]]
binding = "VERSIONS"
bucket_name = "braven-studio-versions"
